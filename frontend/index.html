<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>채티</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="mark">채</div>
      <div class="header-text">
        <h1>채티</h1>
        <p class="sub" id="headerSub">개인 비서 · 일 시키면 알아서 처리</p>
      </div>
      <div class="mode-soft" role="group" aria-label="모드">
        <button type="button" id="modeSecretary" class="soft-btn" aria-pressed="true" title="비서 (기본)">비서</button>
        <button type="button" id="modeRp" class="soft-btn" aria-pressed="false" title="롤플레이">채티(RP)</button>
      </div>
    </header>

    <div id="state" class="state"></div>
    <main id="log" aria-live="polite"></main>

    <div id="loginConfirmBar" class="login-confirm-bar" hidden>
      <p id="loginConfirmHint" class="browse-confirm-hint"></p>
      <button type="button" id="browseConfirm" class="browse-confirm">로그인 허용하고 계속</button>
    </div>

    <form id="form">
      <input id="input" autocomplete="off" placeholder="말해 봐. 검색·열어·확인해… 자연스럽게 시키면 돼" />
      <button type="submit">보내기</button>
    </form>
    <p class="hint">API: <code id="apiLabel"></code> · 대화는 이 기기에 저장 · <button type="button" id="clearPersist" class="linkish">기록 지우기</button></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
