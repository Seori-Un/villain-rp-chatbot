<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>채티</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="mark">채</div>
      <div class="header-text">
        <h1>채티</h1>
        <p class="sub">집착 동역학 롤플레이 · 상태는 말투로만</p>
      </div>
      <button type="button" id="browseToggle" class="mode-btn" aria-pressed="false" title="웹 브라우징 부탁하기">
        웹 시켜줘
      </button>
    </header>

    <div id="browsePanel" class="browse-panel" hidden>
      <div class="browse-head">
        <strong>웹 심부름</strong>
        <span class="browse-hint">대신 열어보고 클릭·타이핑까지 — RP랑 따로야</span>
      </div>
      <label class="browse-label" for="browseGoal">목표</label>
      <textarea id="browseGoal" rows="2" placeholder="예: example.com 열어서 제목 알려줘"></textarea>
      <div class="browse-actions">
        <button type="button" id="browseRun">시켜보기</button>
        <span id="browseStatus" class="browse-status idle" aria-live="polite">대기</span>
      </div>
      <ol id="browseSteps" class="browse-steps" aria-label="단계 로그"></ol>
      <figure id="browseShotWrap" class="browse-shot" hidden>
        <figcaption>마지막 화면</figcaption>
        <img id="browseShot" alt="browse screenshot" />
      </figure>
    </div>

    <div id="state" class="state"></div>
    <main id="log" aria-live="polite"></main>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="말해 봐. /state /reset /silence" />
      <button type="submit">보내기</button>
    </form>
    <p class="hint">API: <code id="apiLabel"></code></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
