<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>채티</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app face-first text-hidden">
    <header>
      <div class="mark">채</div>
      <div class="header-text">
        <h1>채티</h1>
        <p class="sub" id="headerSub">말 걸면 돼 · 검색·웹·기억·코딩 다 내가 해</p>
      </div>
      <button type="button" id="memoryOpen" class="live-btn memory-open" title="기억 (타임라인·주제·검색)">기억</button>
      <button type="button" id="textToggle" class="live-btn" aria-pressed="false" title="글로 보기 / 타이핑">글</button>
    </header>

    <div class="live-bar" role="group" aria-label="라이브 모드">
      <button type="button" id="liveFace" class="live-btn" aria-pressed="false" title="얼굴 표정 모드">얼굴</button>
      <button type="button" id="liveVoice" class="live-btn" aria-pressed="false" title="음성 대화 (ko-KR)">음성</button>
      <button type="button" id="liveCam" class="live-btn" aria-pressed="false" title="카메라로 사람 인식 (영상은 기기 밖으로 안 나감)">카메라</button>
      <span id="liveStatus" class="live-status"></span>
    </div>

    <section id="livePanel" class="live-panel" hidden aria-label="채티 얼굴">
      <svg id="faceSvg" class="face" viewBox="0 0 240 200" data-emotion="calm" aria-hidden="true">
        <defs>
          <radialGradient id="faceGrad" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#2a2018"/>
            <stop offset="100%" stop-color="#141416"/>
          </radialGradient>
        </defs>
        <circle class="head" cx="120" cy="100" r="88" fill="url(#faceGrad)"/>
        <g class="blush">
          <ellipse cx="68" cy="122" rx="16" ry="8"/>
          <ellipse cx="172" cy="122" rx="16" ry="8"/>
        </g>
        <g class="brows">
          <path class="brow brow-l" d="M62 66 Q80 56 100 64"/>
          <path class="brow brow-r" d="M140 64 Q160 56 178 66"/>
        </g>
        <g class="eyes">
          <g class="eye eye-l">
            <ellipse class="white" cx="82" cy="92" rx="18" ry="14"/>
            <circle class="pupil" cx="82" cy="92" r="7"/>
            <circle class="glint" cx="86" cy="88" r="2"/>
            <rect class="lid" x="62" y="76" width="40" height="0"/>
          </g>
          <g class="eye eye-r">
            <ellipse class="white" cx="158" cy="92" rx="18" ry="14"/>
            <circle class="pupil" cx="158" cy="92" r="7"/>
            <circle class="glint" cx="162" cy="88" r="2"/>
            <rect class="lid" x="138" y="76" width="40" height="0"/>
          </g>
        </g>
        <path class="mouth" d="M96 140 Q120 150 144 140"/>
        <ellipse class="mouth-open" cx="120" cy="144" rx="12" ry="0"/>
      </svg>
      <p id="faceCaption" class="face-caption">평온</p>
      <video id="camVideo" class="cam-video" playsinline muted></video>
      <canvas id="camCanvas" class="cam-canvas"></canvas>
    </section>

    <section id="textPanel" class="text-panel" aria-label="글">
      <div class="text-panel-head">
        <span id="textHint" class="text-hint"></span>
        <button type="button" id="textClose" class="linkish">얼굴로 돌아가기</button>
      </div>
      <div id="state" class="state"></div>
      <main id="log" aria-live="polite"></main>

      <div id="loginConfirmBar" class="login-confirm-bar" hidden>
        <p id="loginConfirmHint" class="browse-confirm-hint"></p>
        <button type="button" id="browseConfirm" class="browse-confirm">로그인 허용하고 계속</button>
      </div>

      <form id="form">
        <input id="input" autocomplete="off" placeholder="타이핑으로 말하기 · URL·긴 글·코드는 여기 붙여 넣어" />
        <button type="submit">보내기</button>
      </form>
      <p class="hint">API: <code id="apiLabel"></code> · 대화는 이 기기 + 서버 기억에 저장 · <button type="button" id="clearPersist" class="linkish">이 기기 기록 지우기</button></p>
    </section>
  </div>
  <div id="startOverlay" class="start-overlay">
    <button type="button" id="startBtn" class="start-btn">
      <span class="start-mark">채</span>
      <span>탭해서 채티 깨우기</span>
      <small>얼굴 + 음성으로 시작해 (마이크 권한 필요)</small>
    </button>
    <button type="button" id="startText" class="linkish">그냥 글로 할래</button>
  </div>
  <section id="memoryPanel" class="memory-panel" hidden aria-label="기억">
    <header class="memory-head">
      <strong>채티의 기억</strong>
      <nav class="memory-tabs" role="tablist">
        <button type="button" data-tab="timeline" aria-selected="true">타임라인</button>
        <button type="button" data-tab="topics" aria-selected="false">주제</button>
        <button type="button" data-tab="search" aria-selected="false">검색</button>
      </nav>
      <button type="button" id="memoryNew" class="live-btn" title="새 대화 시작 (기억은 유지)">새 대화</button>
      <button type="button" id="memoryClose" class="live-btn" aria-label="닫기">✕</button>
    </header>
    <p id="memoryStatus" class="memory-status"></p>
    <div id="memoryBody" class="memory-body"></div>
    <footer class="memory-foot">
      <span>기억 코드 <code id="memoryCode"></code></span>
      <button type="button" id="memoryCopyCode" class="linkish">복사</button>
      <button type="button" id="memoryChangeCode" class="linkish">다른 기기 코드 입력</button>
      <button type="button" id="memoryDeleteAll" class="linkish danger">모든 기억 삭제</button>
    </footer>
  </section>
  <script src="app.js"></script>
  <script src="memory.js"></script>
  <script src="live.js"></script>
</body>
</html>
